<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Reverse Tiul Multi - Weighted Markov Ear Training</title>
    <style>
        :root {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            color: #c8d6e5;
        }

        .terminal {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px 20px;
        }

        .header {
            color: #00d2d3;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .config-row {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 6px;
            font-size: 13px;
            flex-wrap: wrap;
        }

        .config-row label {
            color: #778ca3;
        }

        .config-row select {
            font-family: inherit;
            font-size: 13px;
            background: #0f0f23;
            color: #c8d6e5;
            border: 1px solid #334;
            border-radius: 4px;
            padding: 3px 6px;
        }

        .config-row select:focus {
            outline: 1px solid #00d2d3;
        }

        .samples {
            margin: 8px 0 10px;
            padding: 8px 10px;
            background: #0f0f23;
            border: 1px solid #222;
            border-radius: 6px;
            font-size: 12px;
        }

        .samples-title {
            color: #778ca3;
            margin-bottom: 6px;
        }

        .sample-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 2px 0;
        }

        .sample-row input[type="checkbox"] {
            cursor: pointer;
        }

        .sample-row .name {
            flex: 1;
            cursor: pointer;
            user-select: none;
        }

        .sample-row .len {
            color: #576574;
            min-width: 70px;
            text-align: right;
        }

        .sample-row input[type="number"] {
            font-family: inherit;
            font-size: 12px;
            background: #1a1a2e;
            color: #c8d6e5;
            border: 1px solid #334;
            border-radius: 4px;
            padding: 2px 4px;
            width: 46px;
            text-align: center;
        }

        .sample-row input[type="number"]:focus {
            outline: 1px solid #00d2d3;
        }

        .sample-row.off .name,
        .sample-row.off .len {
            color: #3d4a5c;
        }

        .test-toggle {
            cursor: pointer;
            user-select: none;
        }

        .test-toggle input {
            cursor: pointer;
        }

        .commands {
            display: flex;
            gap: 6px;
            margin: 10px 0;
            flex-wrap: wrap;
        }

        .cmd-btn {
            font-family: inherit;
            font-size: 13px;
            background: #0f0f23;
            color: #c8d6e5;
            border: 1px solid #334;
            border-radius: 4px;
            padding: 6px 12px;
            cursor: pointer;
            transition: background 0.1s, border-color 0.1s;
        }

        .cmd-btn:hover:not(:disabled) {
            background: #1e1e3a;
            border-color: #00d2d3;
        }

        .cmd-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .cmd-btn .key {
            color: #feca57;
        }

        .reveal-inline {
            font-size: 14px;
            font-weight: 700;
            color: #54a0ff;
            min-width: 60px;
            display: inline-block;
        }

        .log {
            margin-top: 10px;
            padding: 10px 12px;
            background: #0f0f23;
            border: 1px solid #222;
            border-radius: 6px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
        }

        .log-line { margin: 0; }
        .log-line.info { color: #778ca3; }
        .log-line.note { color: #c8d6e5; }
        .log-line.correct { color: #2ed573; }
        .log-line.wrong { color: #ff6b6b; }
        .log-line.reveal { color: #54a0ff; }
        .log-line.heading { color: #00d2d3; font-weight: 700; }
        .log-line.warn { color: #feca57; }

        .guess-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 8px;
            font-size: 13px;
        }

        .guess-row input {
            font-family: inherit;
            font-size: 14px;
            background: #0f0f23;
            color: #c8d6e5;
            border: 1px solid #334;
            border-radius: 4px;
            padding: 5px 10px;
            width: 100px;
        }

        .guess-row input:focus {
            outline: 1px solid #00d2d3;
        }

        .prompt { color: #feca57; }

        .stats {
            margin-top: 8px;
            font-size: 12px;
            color: #778ca3;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .stats .val { color: #c8d6e5; }

        .available-notes {
            margin-top: 6px;
            font-size: 12px;
            color: #778ca3;
        }

        .available-notes .notes { color: #c8d6e5; }

        .histogram {
            margin-top: 6px;
            font-size: 12px;
            color: #778ca3;
            line-height: 1.7;
        }

        .histogram .bar {
            color: #00d2d3;
        }

        .histogram .hnote {
            color: #c8d6e5;
            display: inline-block;
            min-width: 26px;
        }
    </style>
</head>

<body>
<div class="terminal">
    <div class="header">Reverse Tiul Multi - Weighted Markov Chain Ear Training</div>

    <div class="config-row">
        <label>key:</label>
        <select id="keySelect"></select>
        <label class="test-toggle"><input type="checkbox" id="testMode"/> test mode</label>
        <button class="cmd-btn" id="startBtn" disabled>start</button>
    </div>

    <div class="samples">
        <div class="samples-title">samples &amp; weights (weight = how many times the sample is repeated)</div>
        <div id="sampleRows"></div>
    </div>

    <div class="commands">
        <button class="cmd-btn" id="nextBtn" disabled>[<span class="key">n</span>] next</button>
        <button class="cmd-btn" id="revealBtn" disabled>[<span class="key">r</span>] reveal</button>
        <button class="cmd-btn" id="againBtn" disabled>[<span class="key">a</span>] again</button>

        <span id="revealDisplay" class="reveal-inline"></span>
        <button class="cmd-btn" id="checkBtn" disabled>[<span class="key">c</span>] check</button>
    </div>

    <div class="guess-row">
        <span class="prompt">&gt;</span>
        <input type="text" id="guessInput" placeholder="your guess" autocomplete="off" disabled/>
    </div>

    <div class="available-notes">
        notes in <span id="keyLabel">-</span>: <span id="availableNotes" class="notes">-</span>
    </div>

    <div class="stats">
        <span>played: <span class="val" id="playedCount">0</span></span>
        <span>correct: <span class="val" id="correctCount">0</span></span>
        <span>wrong: <span class="val" id="wrongCount">0</span></span>
        <span>grade: <span class="val" id="grade">-</span></span>
        <span>elapsed: <span class="val" id="elapsed">-</span></span>
    </div>

    <div class="histogram" id="histogram"></div>

    <div id="log" class="log"></div>
</div>

<script src="tiul-constants.js"></script>
<script src="tiul-piano.js"></script>
<script src="et-drill.js"></script>
<script src="et-ui.js"></script>

<script>
    (function () {
        // ============================================================
        // Ported from src/reverse_tiul6.py and
        // src/reverse_tiul_weighted.py, with the note histogram from
        // src/reverse_tiul_history.py.
        //
        // reverse_tiul.html drills a single sample. reverse_tiul6 takes a
        // list of sample indices and concatenates them before building one
        // transition matrix; reverse_tiul_weighted repeats each sample
        // `weight` times first. Plain concatenation is just every weight set
        // to 1, so the two collapse into this one page.
        //
        // The concatenation is literal, matching the Python's
        // combined.extend(sample) - which means each seam contributes one
        // transition from the end of one sample to the start of the next.
        // With samples of 90-190 notes that is a small artifact, and
        // reproducing it keeps the generated material identical to the CLI.
        //
        // The histogram aggregates by note name. reverse_tiul_history keys
        // its Counter on note+octave, which splits one degree across three
        // octaves and makes the distribution harder to read.
        // ============================================================

        const CONFIG = {
            BASE_OCTAVE: 4,
            OCTAVE_VARIATION: 1,
            NOTE_DURATION: 3.0,
            MAX_WEIGHT: 9
        };

        // ---- DOM ----

        const el = {
            keySelect: ETUI.$('keySelect'),
            sampleRows: ETUI.$('sampleRows'),
            testMode: ETUI.$('testMode'),
            startBtn: ETUI.$('startBtn'),
            nextBtn: ETUI.$('nextBtn'),
            againBtn: ETUI.$('againBtn'),
            revealBtn: ETUI.$('revealBtn'),
            checkBtn: ETUI.$('checkBtn'),
            revealDisplay: ETUI.$('revealDisplay'),
            guessInput: ETUI.$('guessInput'),
            logDiv: ETUI.$('log'),
            keyLabel: ETUI.$('keyLabel'),
            availableNotes: ETUI.$('availableNotes'),
            playedCount: ETUI.$('playedCount'),
            correctCount: ETUI.$('correctCount'),
            wrongCount: ETUI.$('wrongCount'),
            grade: ETUI.$('grade'),
            elapsed: ETUI.$('elapsed'),
            histogram: ETUI.$('histogram')
        };

        KEY_ORDER.forEach(function (k) {
            const opt = document.createElement('option');
            opt.value = k;
            opt.textContent = k.replace('-', 'b');
            el.keySelect.appendChild(opt);
        });
        el.keySelect.value = 'D';

        // ---- sample picker ----

        // One row per sample: on/off plus an integer weight.
        const sampleState = SAMPLE_LABELS.map(function (label, i) {
            return { index: i, label: label, on: i === 0, weight: 1 };
        });

        function renderSampleRows() {
            el.sampleRows.innerHTML = '';
            sampleState.forEach(function (s) {
                const row = document.createElement('div');
                row.className = 'sample-row' + (s.on ? '' : ' off');

                const box = document.createElement('input');
                box.type = 'checkbox';
                box.checked = s.on;
                box.id = 'sample_' + s.index;

                const name = document.createElement('label');
                name.className = 'name';
                name.htmlFor = box.id;
                name.textContent = s.label;

                const len = document.createElement('span');
                len.className = 'len';
                len.textContent = SAMPLES[s.index].length + ' notes';

                const weight = document.createElement('input');
                weight.type = 'number';
                weight.min = 1;
                weight.max = CONFIG.MAX_WEIGHT;
                weight.value = s.weight;
                weight.disabled = !s.on;
                weight.title = 'weight';

                box.addEventListener('change', function () {
                    s.on = box.checked;
                    // Never leave the matrix with nothing to build from.
                    if (!sampleState.some(x => x.on)) {
                        s.on = true;
                        box.checked = true;
                        log('At least one sample has to stay selected.', 'warn');
                        return;
                    }
                    row.className = 'sample-row' + (s.on ? '' : ' off');
                    weight.disabled = !s.on;
                });

                weight.addEventListener('change', function () {
                    let v = parseInt(weight.value, 10);
                    if (isNaN(v) || v < 1) v = 1;
                    if (v > CONFIG.MAX_WEIGHT) v = CONFIG.MAX_WEIGHT;
                    weight.value = v;
                    s.weight = v;
                });

                row.appendChild(box);
                row.appendChild(name);
                row.appendChild(len);
                row.appendChild(weight);
                el.sampleRows.appendChild(row);
            });
        }

        function activeSamples() {
            return sampleState.filter(s => s.on);
        }

        // ---- log ----

        function log(text, cls) {
            const p = document.createElement('p');
            p.className = 'log-line ' + (cls || 'note');
            p.textContent = text;
            el.logDiv.appendChild(p);
            el.logDiv.scrollTop = el.logDiv.scrollHeight;
        }

        function clearLog() {
            el.logDiv.innerHTML = '';
        }

        // ---- session ----

        let session = null;

        // _concatenate_samples_with_weights: repeat each sample `weight`
        // times, then concatenate.
        function concatenateWithWeights(samples) {
            let combined = [];
            samples.forEach(function (s) {
                for (let i = 0; i < s.weight; i++) {
                    combined = combined.concat(SAMPLES[s.index]);
                }
            });
            return combined;
        }

        function createSession(key, samples) {
            const keyDegrees = KEY_DEGREES[key];
            const combined = concatenateWithWeights(samples);

            return {
                key: key,
                keyDegrees: keyDegrees,
                combined: combined,
                transitionMatrix: buildTransitionMatrix(combined, keyDegrees.length),
                currentIndex: 0,
                currentPitch: keyDegrees[0],
                currentOctave: CONFIG.BASE_OCTAVE,
                lastPlayedDisplay: null,
                noteCounts: {},
                startTime: Date.now(),
                started: false,
                firstNote: true        // the session opens on the tonic
            };
        }

        function playNote(s, forceOctave) {
            const v = CONFIG.OCTAVE_VARIATION;
            const octave = forceOctave != null
                ? forceOctave
                : Math.max(1, Math.min(8, CONFIG.BASE_OCTAVE + ET_randInt(2 * v + 1) - v));
            s.currentOctave = octave;

            const midi = tiulNameToMidi(s.currentPitch, octave);
            const name = parseTiulName(s.currentPitch).displayName;
            s.lastPlayedDisplay = name + octave;

            if (TiulPiano.isReady()) {
                TiulPiano.stopAll();
                TiulPiano.play(midi, CONFIG.NOTE_DURATION);
            }
            return s.lastPlayedDisplay;
        }

        function ET_randInt(n) {
            return Math.floor(Math.random() * n);
        }

        // ---- drill ----

        const drill = ETDrill.create({
            generate: function () {
                const s = session;

                // The first note of a session is the tonic itself, not a
                // step through the chain - same as reverse_tiul.html and the
                // Python, which play current_pitch before advancing.
                if (s.firstNote) {
                    s.firstNote = false;
                    return { pitch: s.currentPitch };
                }

                const weights = s.transitionMatrix[s.currentIndex];
                const nextPitch = weightedChoice(s.keyDegrees, weights);
                s.currentIndex = s.keyDegrees.indexOf(nextPitch);
                s.currentPitch = nextPitch;
                return { pitch: nextPitch };
            },
            play: function () {
                const display = playNote(session);
                const name = display.replace(/\d+$/, '');
                session.noteCounts[name] = (session.noteCounts[name] || 0) + 1;
                log('Note #' + (drill.state.played + 1) + ' played.', 'info');
            },
            describe: function () {
                return session.lastPlayedDisplay;
            },
            check: function (raw) {
                const m = /^([A-Ga-g])\s*([#bB\-]*)$/.exec((raw || '').trim());
                if (!m) {
                    return { invalid: true, message: 'Invalid input. Use a note name like C, F#, Eb or B-' };
                }
                const letter = m[1].toUpperCase();
                let acc = '';
                for (const ch of m[2]) {
                    if (ch === '#') acc += '#';
                    else if (ch === '-' || ch === 'b' || ch === 'B') acc += 'b';
                }
                const guess = letter + acc;
                const correct = session.lastPlayedDisplay.replace(/\d+$/, '');

                if (guess.toUpperCase() === correct.toUpperCase()) {
                    return { correct: true, message: 'Correct! The note was ' + correct };
                }
                return { correct: false, message: 'Incorrect.' };
            }
        });

        // ---- stats ----

        function renderStats() {
            el.playedCount.textContent = drill.state.played;
            el.correctCount.textContent = drill.state.correct;
            el.wrongCount.textContent = drill.state.wrong;

            const total = drill.state.correct + drill.state.wrong;
            el.grade.textContent = total > 0
                ? ((drill.state.correct / total) * 100).toFixed(1) + '%'
                : '-';

            if (session && session.started) {
                const secs = Math.round((Date.now() - session.startTime) / 1000);
                el.elapsed.textContent = secs < 60
                    ? secs + 's'
                    : Math.floor(secs / 60) + 'm ' + (secs % 60) + 's';
            }

            renderHistogram();
        }

        // get_note_histogram, drawn as bars so the shape is readable at a glance.
        function renderHistogram() {
            if (!session || !session.started) {
                el.histogram.innerHTML = '';
                return;
            }
            const entries = Object.keys(session.noteCounts)
                .map(k => [k, session.noteCounts[k]])
                .sort((a, b) => b[1] - a[1]);

            if (entries.length === 0) {
                el.histogram.innerHTML = '';
                return;
            }

            const max = entries[0][1];
            el.histogram.innerHTML = 'notes played:<br/>' + entries.map(function (e) {
                const width = Math.max(1, Math.round((e[1] / max) * 24));
                return '<span class="hnote">' + e[0] + '</span> '
                    + '<span class="bar">' + '█'.repeat(width) + '</span> ' + e[1];
            }).join('<br/>');
        }

        function setCommandsEnabled(enabled) {
            el.nextBtn.disabled = !enabled;
            el.againBtn.disabled = !enabled;
            el.revealBtn.disabled = !enabled;
            el.checkBtn.disabled = !enabled;
            el.guessInput.disabled = !enabled;
        }

        // ---- actions ----

        function doStart() {
            if (!TiulPiano.isReady()) { log('Piano not loaded yet.', 'warn'); return; }

            const samples = activeSamples();
            const key = el.keySelect.value;

            session = createSession(key, samples);
            drill.reset();
            clearLog();
            el.revealDisplay.textContent = '';

            log('Reverse Tiul Multi Training Started!', 'heading');
            log('Key: ' + key, 'info');

            // _show_sample_info
            let total = 0;
            samples.forEach(function (s) {
                const contribution = SAMPLES[s.index].length * s.weight;
                total += contribution;
                log('  Sample ' + s.index + ': ' + SAMPLES[s.index].length
                    + ' notes × ' + s.weight + ' = ' + contribution, 'info');
            });
            log('  Combined length: ' + total, 'info');

            const degrees = [...new Set(session.combined)].sort((a, b) => a - b);
            const available = degrees
                .filter(i => i < session.keyDegrees.length)
                .map(i => parseTiulName(session.keyDegrees[i]).displayName);

            log('Available notes in samples: ' + available.join(', '), 'info');
            log('Commands: (n)ext, (a)gain, (r)eveal, (c)heck', 'info');
            log('', 'info');

            el.keyLabel.textContent = key;
            el.availableNotes.textContent = session.keyDegrees
                .map(n => parseTiulName(n).displayName).join(', ');

            session.started = true;

            // Plays the tonic; drill.play() does the counting.
            drill.play();

            setCommandsEnabled(true);
            renderStats();

            if (el.testMode.checked) el.guessInput.focus();
        }

        function doNext() {
            if (!session || !session.started) return;
            el.revealDisplay.textContent = '';
            drill.next();
            renderStats();
            if (el.testMode.checked) {
                el.guessInput.value = '';
                el.guessInput.focus();
            }
        }

        // Replays at the same octave and does not count as another note.
        function doAgain() {
            if (!session || !session.started) return;
            playNote(session, session.currentOctave);
            log('(replayed)', 'info');
        }

        function doReveal() {
            if (!session || !session.started) return;
            const text = drill.reveal();
            if (!text) {
                log('No note played yet.', 'warn');
                return;
            }
            el.revealDisplay.textContent = text;
            log('Revealed: ' + text, 'reveal');
            renderStats();
        }

        function doCheck() {
            if (!session || !session.started) return;
            const raw = el.guessInput.value.trim();
            if (!raw) { el.guessInput.focus(); return; }

            const result = drill.submit(raw);
            log(result.message, result.scored ? (result.correct ? 'correct' : 'wrong') : 'warn');

            el.guessInput.value = '';
            renderStats();
            if (el.testMode.checked) el.guessInput.focus();
        }

        // ---- wiring ----

        el.startBtn.addEventListener('click', doStart);
        el.nextBtn.addEventListener('click', doNext);
        el.againBtn.addEventListener('click', doAgain);
        el.revealBtn.addEventListener('click', doReveal);
        el.checkBtn.addEventListener('click', doCheck);

        ETUI.guessField(el.guessInput, doCheck);

        ETUI.shortcuts({
            N: doNext,
            A: doAgain,
            R: doReveal,
            C: doCheck
        });

        renderSampleRows();
        setInterval(renderStats, 1000);

        log('Loading piano samples...', 'info');
        ETUI.boot({
            status: null,
            enable: [el.startBtn],
            range: [40, 88],
            onReady: function () {
                log('Piano loaded. Pick a key, tick samples and weights, then press start.', 'heading');
            }
        });
    })();
</script>
</body>
</html>
